server:
  port: 8088
  servlet:
    context-path: /
    session:
      # 会话超时（Duration格式，支持：30m、1h、1d 等）
      timeout: 1d
      cookie:
        # 仅 HTTP 访问，禁止 JS 读取 document.cookie
        http-only: true
        # HTTPS 环境下应设为 true
        secure: false
        # 跨站防护：Lax（默认，允许部分GET跨站）/ Strict / None
        same-site: Lax

spring:
  application:
    name: boot-demo
  datasource:
    url: jdbc:mysql://localhost:3306/demo?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置（核心）
    hikari:
      # 最小空闲连接数（建议：CPU核心数*2）
      minimum-idle: 10
      # 最大连接数（关键！需根据业务压测调整，建议：CPU核心数*4 + 预留）
      maximum-pool-size: 50
      # 连接超时时间（获取连接的等待时间，建议30秒）
      connection-timeout: 30000
      # 空闲连接超时时间（释放空闲连接，建议10分钟）
      idle-timeout: 600000
      # 连接最大存活时间（避免长时间占用连接，建议30分钟）
      max-lifetime: 1800000
      # 检测泄露
      leak-detection-threshold: 60000
      # 连接池初始化失败是否抛异常
      initialization-fail-timeout: 1
  # 解决swagger和springBoot高版本冲突问题
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  jpa:
    # 显示sql
    show-sql: true
    # 自动生成表结构 关闭设为none
    hibernate:
      ddl-auto: update
      naming:
      # 驼峰命名
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  servlet:
    multipart:
      # 限制单个上传文件的最大大小
      max-file-size: -1
      # 限制一次请求上传文件的总大小
      max-request-size: -1
      # 设置文件写入磁盘的阈值大小
      file-size-threshold: 5KB
      # 文件上传临时目录
      location: /tmp
      # 控制是否延迟解析multipart请求
      resolve-lazily: false
  # FreeMarker 配置
  freemarker:
    # 模板文件存放路径（默认就是 classpath:/templates/，可省略）
    template-loader-path: classpath:/templates/
    # 模板文件后缀（默认 .ftlh，推荐使用）
    suffix: .ftlh
    # 开发环境关闭缓存，修改模板无需重启服务
    cache: false
    # 编码格式
    charset: UTF-8
    # 内容类型
    content-type: text/html

  mail:
    defaultEncoding: UTF-8
    host: smtp.163.com
    port: 465
    username: xxx@163.com
    password: xxx
    properties:
      mail:
        smtp:
          ssl:
            enable: true

mybatis-plus:
  #mapper路径
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lty.model.entity
  #mapper配置路径
  # config-location: classpath:static/mybatis/mybatis-config.xml
  global-config:
    # 关闭MP3.0+自带的banner
    banner: false
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名(since 3.3.0,配置后可以忽略不配置步骤2)
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
  configuration:
    #下划线转驼峰
    map-underscore-to-camel-case: false
    #打印SQL日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 接口文档增强UI Swagger界面内容配置
knife4j:
  enable: true

# 配置文件加密
jasypt:
  encryptor:
    password: lty